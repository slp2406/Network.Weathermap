targets:
  - refId: A
    datasource:
      type: prometheus
      uid: e5ebe0e3-4d0e-4311-8bdf-bbba2133fcf1
    expr: up{instance="DC1-8500L-IE"} == 1

data:
  device1:
    query: A

cells:
  cell-DC1-8500L-IE:
    dataRef: device1

    fillColor:
      thresholds:
        - { level: 0, color: "red" }
        - { level: 1, color: "green" }

    strokeColor:
      thresholds:
        - { level: 0, color: "red" }
        - { level: 1, color: "green" }

    textColor:
      thresholds:
        - { level: 0, color: "white" }
        - { level: 1, color: "white" }

    defaultColor: "gray"
